# Outlook MCP Server Configuration - FORK (multi-account allowlist)
# Fork of Abhishek-Aditya-bs/Outlook-MCP-Server @ bb641f7
#
# SECURITY: included_accounts is a fail-closed allowlist. If it is empty,
# the server returns no results for any search. A new Outlook account added
# later will NOT become visible to Claude unless explicitly added here.

# === Account Allowlist (REQUIRED) ===
# Comma-separated SMTP addresses of the Outlook accounts that may be searched.
# Examples:
#   included_accounts=you@example.com
#   included_accounts=you@example.com, team@example.org
# Leave empty to disable the server (fail-closed).
included_accounts=

# === Deprecated / Ignored (upstream compatibility) ===
# `shared_mailbox_email` and `shared_mailbox_name` are NO LONGER USED in this
# fork. They were tied to the single-default + single-delegated-shared
# architecture of upstream. This fork uses the `included_accounts` allowlist
# above. If `shared_mailbox_email` is set in this file, the server logs a
# deprecation warning at startup and ignores the value.
# shared_mailbox_email=
# shared_mailbox_name=

# === Data Retention Policies (Informational Only) ===
# How many months emails are typically retained (for reference only)
personal_retention_months=6
shared_retention_months=12

# === Search Configuration ===
# Maximum number of emails to return per search (across all accounts combined)
max_search_results=50

# Maximum characters to search in email body during pattern matching (perf)
max_search_body_chars=500

# Maximum characters to include from email body in final results.
# 0 = no limit. WARNING: 0 means FULL email bodies (including anything
# sensitive that matches your search) flow into the LLM context.
max_body_chars=0

# Whether to include Sent Items folder in searches (honored when
# search_all_folders=true; see below)
include_sent_items=true

# Whether to include deleted items in searches
include_deleted_items=false

# === Performance Settings ===
connection_timeout_minutes=10
max_retry_attempts=3
batch_processing_size=10
max_connection_retries=3
max_recipients_display=10

# === Alert Analysis Settings ===
analyze_importance_levels=true

# === Email Processing ===
# If true, also search Sent Items and Drafts in each allowlisted store.
# NOTE: The name "search_all_folders" is retained from upstream for backward
# compatibility. It does NOT walk every folder - it covers only Sent Items
# and Drafts. Leave false for Inbox-only (recommended on first run).
search_all_folders=false

# (Upstream flag, kept for compatibility)
use_folder_traversal=false

# === Security Settings ===
# Try Extended MAPI login to potentially reduce security prompts (experimental)
use_extended_mapi_login=true

# Include timestamp in formatted responses
include_timestamps=true

# Clean HTML from email bodies before returning
clean_html_content=true
